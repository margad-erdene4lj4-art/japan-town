else{keys.up=keys.dn=keys.lt=keys.rt=keys.brk=0;updateSiren(999);const t=boat.v>car.v?boat:car;G.tg.set(t.x,t.y+3,t.z);G.r=65;G.th=t.yaw+Math.PI;G.ph=1.1;th=G.th;ph=G.ph;r=G.r;tg.copy(G.tg)}}

$('drv').onclick=()=>{setMode(ctrlMode==='car'?'orbit':'car');$('drv').blur()};$('boatB').onclick=()=>{setMode(ctrlMode==='boat'?'orbit':'boat');$('boatB').blur()};
const camNames=['Энгийн','Дотор','Хол'];function cycleCam(){car.camMode=(car.camMode+1)%3;$('camb').textContent='Камер: '+camNames[car.camMode]}
$('camb').onclick=()=>{cycleCam();$('camb').blur()};$('sndb').onclick=()=>{muted=!muted;$('sndb').textContent=muted?'🔇':'🔊';if(!muted)ensureAudio();$('sndb').blur()};$('rstb').onclick=()=>{resetCtrl();$('rstb').blur()};

V.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v[0];b.setAttribute('aria-pressed',i==0);
b.onclick=()=>{if(isControl())setMode('orbit');G.tg.set(v[1],v[2],v[3]);G.r=v[4];G.th=v[5];G.ph=v[6];auto=!calm&&i==0;[...$('nv').children].forEach(c=>c.setAttribute('aria-pressed',c==b))};$('nv').appendChild(b)});

const cv=$('c'),ps=new Map();cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,e);auto=false});
cv.addEventListener('pointerup',e=>ps.delete(e.pointerId));cv.addEventListener('pointercancel',e=>ps.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{const o=ps.get(e.pointerId);if(!o)return;if(isControl()){if(ps.size==1)lookOff=cl(lookOff-(e.clientX-o.clientX)*.005,-1.8,1.8)}
else if(ps.size==1){G.th-=(e.clientX-o.clientX)*.006;G.ph=cl(G.ph-(e.clientY-o.clientY)*.005,.12,1.5)}
else if(ps.size==2){const q=[...ps.values()],d0=Math.hypot(q[0].clientX-q[1].clientX,q[0].clientY-q[1].clientY);ps.set(e.pointerId,e);const q2=[...ps.values()],d1=Math.hypot(q2[0].clientX-q2[1].clientX,q2[0].clientY-q2[1].clientY);if(d1)G.r=cl(G.r*d0/d1,15,1300)}ps.set(e.pointerId,e)});
cv.addEventListener('wheel',e=>{e.preventDefault();if(!isControl()){G.r=cl(G.r*(1+e.deltaY*.001),15,1300);auto=false}},{passive:false});

const KM={KeyW:'up',ArrowUp:'up',KeyS:'dn',ArrowDown:'dn',KeyA:'lt',ArrowLeft:'lt',KeyD:'rt',ArrowRight:'rt',Space:'brk'};
addEventListener('keydown',e=>{if(!isControl())return;ensureAudio();if(e.code in KM){e.preventDefault();keys[KM[e.code]]=1}else if(e.code=='KeyC')cycleCam();else if(e.code=='KeyR')resetCtrl();else if(e.code=='Escape')setMode('orbit')});
addEventListener('keyup',e=>{if(e.code in KM)keys[KM[e.code]]=0});addEventListener('blur',()=>{keys.up=keys.dn=keys.lt=keys.rt=keys.brk=0});
addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});
function bindBtn(id,prop){const el=$(id),set=(on,e)=>{if(e){e.preventDefault();if(on){ensureAudio();if(e.pointerId!=null)try{el.setPointerCapture(e.pointerId)}catch{}}}keys[prop]=on?1:0;el.classList.toggle('act',on)};
el.addEventListener('pointerdown',e=>set(1,e));el.addEventListener('pointerup',e=>set(0,e));el.addEventListener('pointercancel',e=>set(0,e));el.addEventListener('lostpointercapture',()=>set(0))}
bindBtn('tl','lt');bindBtn('trb','rt');bindBtn('tgo','up');bindBtn('tbk','dn');

function size(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
updateTrafficLights(true);stepPeds(0,true);sc.traverse(o=>{if(o.isInstancedMesh||o.isPoints)o.frustumCulled=false});
const clk=new T.Clock();updateEnvironment(.016);

(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);updateEnvironment(dt);
if(!calm){tlTime+=dt;tx=tx>380?-280:tx+55*dt;FWR.rotation.z+=dt*.18}updateTrafficLights();TR.forEach((g,n)=>g.position.x=tx-n*7.6);stepMetro(dt);
if(banTimer>0){banTimer-=dt;if(banTimer<=0)$('banner').classList.remove('show')}if(shake>0)shake=Math.max(0,shake-dt*1.8);
if(ctrlMode==='car'){stepCar(dt);stepCops(dt);drawMinimap()}else if(ctrlMode==='boat'){stepBoat(dt);stepCops(dt);drawMinimap()}
PC.position.set(car.x,car.y,car.z);PC.rotation.set(car.pitch,car.yaw,0);PB.position.set(boat.x,boat.y,boat.z);PB.rotation.set(0,boat.yaw,boat.roll);
if(isControl()){const obj=ctrlMode==='boat'?boat:car,a=obj.yaw+lookOff,fwX=Math.sin(a),fwZ=Math.cos(a),sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake,pch=ctrlMode==='car'?car.pitch:0;
if(car.camMode==1){cam.position.set(obj.x+Math.sin(obj.yaw)*.25+sx,obj.y+(ctrlMode==='boat'?1.15:.85)+sy,obj.z+Math.cos(obj.yaw)*.25);camLook.set(obj.x+fwX*24,obj.y+.7-Math.sin(pch)*14,obj.z+fwZ*24);cam.lookAt(camLook)}
else{const dist=car.camMode==2?20:(ctrlMode==='boat'?13:10.5),ht=car.camMode==2?8.5:(ctrlMode==='boat'?5.2:4.4);camPos.lerp(new T.Vector3(obj.x-fwX*dist,Math.max(1.8,obj.y+ht+Math.sin(pch)*3),obj.z-fwZ*dist),1-Math.exp(-9*dt));cam.position.set(camPos.x+sx,camPos.y+sy,camPos.z);camLook.set(obj.x+fwX*6,obj.y+1.4,obj.z+fwZ*6);cam.lookAt(camLook)}}
else{if(auto)G.th+=dt*.07;const d=((G.th-th+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;th+=d*.08;ph+=(G.ph-ph)*.08;r+=(G.r-r)*.08;tg.lerp(G.tg,.08);cam.position.set(tg.x+r*Math.sin(ph)*Math.sin(th),Math.max(3,tg.y+r*Math.cos(ph)),tg.z+r*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)}
stepTraffic(dt);stepRoads(calm?0:dt);stepBoatsAI(dt);stepPeds(dt,false);stepSparks(dt);if(!calm)ABM.forEach((m,i)=>m.color.setScalar(.8+.2*Math.sin(clk.elapsedTime*(1.6+i*.5)+i*2)));
ren.render(sc,cam)})();
})();
